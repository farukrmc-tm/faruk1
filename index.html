<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Almanca Kelime Kartları (Bildung und Forschung)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f0fdf4; } /* Açık yeşil arka plan */
        
        .scene {
            width: 100%;
            height: 350px;
            perspective: 1000px;
        }
        
        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.6s;
            transform-style: preserve-3d;
            cursor: pointer;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            border-radius: 1rem;
        }
        
        .card.is-flipped {
            transform: rotateY(180deg);
        }
        
        .card__face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            border-radius: 1rem;
            text-align: center;
            background: white;
        }
        
        .card__face--front {
            border-bottom: 6px solid #22c55e; /* Yeşil alt kenarlık */
        }
        
        .card__face--back {
            transform: rotateY(180deg);
            background: #f8fafc;
            border-bottom: 6px solid #3b82f6; /* Mavi alt kenarlık */
        }
        
        /* Highlighted text in sentence */
        .highlight {
            color: #166534;
            font-weight: 700;
            background-color: #dcfce7;
            padding: 0.1rem 0.4rem;
            border-radius: 0.25rem;
        }
    </style>
</head>
<body class="text-gray-800 h-screen flex flex-col overflow-hidden">

    <header class="bg-green-600 text-white shadow-md p-4 shrink-0">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold"><i class="fas fa-graduation-cap mr-2"></i>Almanca Ezber Kartları</h1>
                <p class="text-sm text-green-100">Bildung und Forschung (Sayfa 7-45)</p>
            </div>
            <div class="text-right">
                <div class="text-sm font-medium bg-green-700 px-3 py-1 rounded-full inline-block">
                    İlerleme: <span id="progress-text">0/0</span>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-1 overflow-auto p-4 sm:p-6 w-full max-w-4xl mx-auto flex flex-col items-center justify-center">
        
        <!-- Controls & Stats -->
        <div class="w-full flex justify-between items-center mb-6 px-2">
            <button onclick="shuffleDeck()" class="text-gray-500 hover:text-green-600 transition flex items-center gap-2">
                <i class="fas fa-random"></i> Kartları Karıştır
            </button>
            <div class="text-sm text-gray-500">
                Öğrenilen: <span id="learned-count" class="font-bold text-green-600">0</span>
            </div>
        </div>

        <!-- The Flashcard -->
        <div class="scene w-full max-w-2xl mb-8">
            <div class="card" id="flashcard" onclick="flipCard()">
                <!-- Front (German Sentence) -->
                <div class="card__face card__face--front">
                    <span class="absolute top-4 left-4 text-xs font-bold text-gray-400 uppercase tracking-widest"><i class="fas fa-book-open mr-1"></i> Sayfa <span id="page-number"></span></span>
                    <span class="absolute top-4 right-4 text-xs font-bold text-gray-400"><i class="fas fa-sync-alt mr-1"></i> Çevirmek için tıkla</span>
                    
                    <p id="german-sentence" class="text-2xl sm:text-3xl font-medium text-gray-800 leading-snug mt-4">
                        <!-- Sentence injected here -->
                    </p>
                </div>
                
                <!-- Back (Meaning/Base Form) -->
                <div class="card__face card__face--back">
                    <span class="text-sm font-semibold text-blue-500 mb-2 uppercase tracking-wide">Kalıp / Kök Hali</span>
                    <h2 id="base-form" class="text-3xl sm:text-4xl font-bold text-gray-900 mb-6">
                        <!-- Base form injected here -->
                    </h2>
                    
                    <div class="w-full h-px bg-gray-200 mb-6"></div>
                    
                    <span class="text-xs text-gray-500 mb-1">Cümledeki Hali:</span>
                    <p id="word-form" class="text-lg font-medium text-gray-700 italic">
                        <!-- Word form injected here -->
                    </p>
                </div>
            </div>
        </div>

        <!-- Action Buttons (Hidden until card is flipped) -->
        <div id="action-buttons" class="flex gap-4 w-full max-w-2xl opacity-0 transition-opacity duration-300 pointer-events-none">
            <button onclick="handleAnswer(false)" class="flex-1 bg-white border-2 border-red-200 text-red-600 font-bold py-4 px-6 rounded-xl hover:bg-red-50 hover:border-red-300 transition shadow-sm flex items-center justify-center gap-2 text-lg">
                <i class="fas fa-times-circle"></i> Bilemedim
            </button>
            <button onclick="handleAnswer(true)" class="flex-1 bg-green-500 text-white font-bold py-4 px-6 rounded-xl hover:bg-green-600 transition shadow-md flex items-center justify-center gap-2 text-lg">
                <i class="fas fa-check-circle"></i> Bildim
            </button>
        </div>

        <!-- Completion Screen -->
        <div id="completion-screen" class="hidden flex-col items-center justify-center text-center p-8 bg-white rounded-2xl shadow-lg w-full max-w-2xl">
            <div class="text-6xl text-green-500 mb-4"><i class="fas fa-trophy"></i></div>
            <h2 class="text-3xl font-bold text-gray-800 mb-2">Harika İş!</h2>
            <p class="text-gray-600 mb-8 text-lg">Tüm kelimeleri en az bir kere doğru bildin.</p>
            <button onclick="resetApp()" class="bg-green-600 text-white font-bold py-3 px-8 rounded-lg hover:bg-green-700 transition">
                Tekrar Başla
            </button>
        </div>

    </main>

    <script>
        // Veritabanı: Sayfa 7'den 45'e kadar belirtilen Bildung und Forschung bölümü.
        // Özellikle 9, 10, 11 ve 12. sayfalardaki (12. sayfa başındaki Schuluniform dahil) kelimeler özenle seçildi.
        const allVocabData = [
            // Sayfa 9
            { page: 9, word: "eingeschult", base: "eingeschult werden", sentence: "Die meisten Kinder werden im Alter von sechs Jahren eingeschult." },
            { page: 9, word: "zur Schule", base: "zur Schule gehen", sentence: "Wenn man Abitur machen will, muss man 12 oder 13 Jahre zur Schule gehen." },

            { page: 9, word: "Schulpflicht", base: "die Schulpflicht", sentence: "Die Dauer der allgemeinen Schulpflicht beträgt in Deutschland mindestens neun Schuljahre." },
            { page: 9, word: "schwänzt", base: "die Schule schwänzen", sentence: "Eigentlich müsste sie jetzt im Unterricht sein, aber sie schwänzt die Schule." },
            { page: 9, word: "öffentliche Schulen", base: "die öffentliche Schule", sentence: "Die meisten Schülerinnen und Schüler in Deutschland besuchen öffentliche Schulen." },
            { page: 9, word: "Privatschulen", base: "die Privatschule", sentence: "Die Zahl der Schüler, die Privatschulen besuchen, steigt kontinuierlich." },
            { page: 9, word: "Ganztagsschulen", base: "die Ganztagsschule", sentence: "In Deutschland werden immer mehr Ganztagsschulen eingerichtet." },
            { page: 9, word: "Internat", base: "das Internat", sentence: "Im Internat teilen sich meistens zwei Schüler ein Zimmer." },
            { page: 9, word: "Klasse", base: "die Klasse", sentence: "Die Grundschulzeit dauert in Bayern von der 1. bis zur 4. Klasse." },
            { page: 9, word: "aufs Gymnasium", base: "aufs Gymnasium gehen", sentence: "Am Ende der Grundschulzeit wird entschieden, ob man aufs Gymnasium geht." },
            { page: 9, word: "Schulabschluss", base: "den Schulabschluss machen", sentence: "Viele Schüler, die nächstes Jahr ihren Schulabschluss machen, suchen einen Ausbildungsplatz." },
            { page: 9, word: "abgebrochen", base: "die Schule abbrechen", sentence: "Wer die Schule abgebrochen hat, hat keinen Schulabschluss." },
            
            // Sayfa 10
            { page: 10, word: "nachholen", base: "einen Schulabschluss nachholen", sentence: "Wer keinen Schulabschluss gemacht hat, kann diesen nachholen." },
            { page: 10, word: "Abitur gemacht", base: "(das) Abitur machen", sentence: "Wenn man Abitur gemacht hat, kann man sich um einen Studienplatz bewerben." },
            { page: 10, word: "Hauptfächern", base: "das Hauptfach", sentence: "Der Unterricht in den Hauptfächern Deutsch, Englisch und Mathematik ist wichtig." },
            { page: 10, word: "Nebenfächern", base: "das Nebenfach", sentence: "In den Nebenfächern haben die Schüler weniger Unterricht." },
            { page: 10, word: "unterrichtet", base: "etw. unterrichten", sentence: "Der Lehrer unterrichtet seit 15 Jahren Englisch und Sport." },
            { page: 10, word: "Unterricht geben", base: "Unterricht geben / erteilen", sentence: "Die Hauptaufgabe von Lehrern ist es, Unterricht zu geben." },
            { page: 10, word: "Lernstoff", base: "der Lernstoff", sentence: "Genetik gehört zum Lernstoff der 9. Klasse." },
            { page: 10, word: "vermitteln", base: "jdm. etw. vermitteln", sentence: "Der Lehrer soll den Schülern den Lernstoff vermitteln." },
            
            // Sayfa 11
            { page: 11, word: "Didaktik", base: "die Didaktik", sentence: "Zukünftige Lehrer müssen sich mit Didaktik beschäftigen." },
            { page: 11, word: "Lehrpläne", base: "der Lehrplan", sentence: "Die Ministerien erstellen Lehrpläne, in denen Unterrichtsinhalte festgelegt sind." },
            { page: 11, word: "Klassenarbeiten", base: "die Klassenarbeit", sentence: "In den Hauptfächern werden regelmäßig Klassenarbeiten geschrieben." },
            { page: 11, word: "Noten", base: "die Note", sentence: "Kinder sind enttäuscht, wenn sie keine gute Note bekommen." },
            { page: 11, word: "benotet", base: "etw. benoten", sentence: "Wenn Schüler wissen, dass eine Hausaufgabe benotet wird, arbeiten sie konzentrierter." },
            { page: 11, word: "Leistungen", base: "die Leistung", sentence: "Früher war sie eine gute Schülerin, aber ihre Leistungen haben nachgelassen." },
            { page: 11, word: "Zeugnisse", base: "das Zeugnis", sentence: "Schüler bekommen am Ende jedes Schulhalbjahres Zeugnisse." },
            { page: 11, word: "sitzen bleiben", base: "nicht versetzt werden / sitzen bleiben", sentence: "Schlechte Schüler bleiben sitzen und müssen das Schuljahr wiederholen." },
            { page: 11, word: "Nachhilfe", base: "die Nachhilfe", sentence: "Spezielle Institute bieten Nachhilfe in einzelnen Fächern an." },
            { page: 11, word: "Mitschülern", base: "der Mitschüler", sentence: "Kinder sollen lernen, mit ihren Mitschülern zusammenzuarbeiten." },

            // Sayfa 12
            { page: 12, word: "Schuluniformen", base: "die Schuluniform", sentence: "Da es an deutschen Schulen keine Schuluniformen gibt, entscheiden die Schüler selbst, was sie anziehen." },
            { page: 12, word: "begabt", base: "begabt sein", sentence: "Die Schülerin ist mathematisch und naturwissenschaftlich begabt." },
            { page: 12, word: "fördern", base: "jdn./etw. fördern", sentence: "Die Eltern fördern ihr Kind durch zusätzlichen Musikunterricht." },
            
            // Sayfa 13
            { page: 13, word: "Fähigkeiten", base: "Fähigkeiten erwerben", sentence: "Schüler sollen auch praktische Fähigkeiten erwerben." },
            { page: 13, word: "Kenntnisse", base: "sich Kenntnisse aneignen", sentence: "Er hat sich seine Kenntnisse mithilfe von Büchern angeeignet." },
            { page: 13, word: "auswendig", base: "auswendig lernen", sentence: "Früher mussten die Schüler viel auswendig lernen." },
            { page: 13, word: "einprägen", base: "sich etw. einprägen", sentence: "Vor einer Prüfung sollte man sich wichtige Daten gut einprägen." },
            { page: 13, word: "Prüfung ablegen", base: "eine Prüfung ablegen", sentence: "Die meisten Menschen sind nervös, wenn sie eine Prüfung ablegen müssen." },
            { page: 13, word: "bestanden", base: "eine Prüfung bestehen", sentence: "Er hat die Prüfung bestanden, obwohl die Aufgaben schwierig waren." },
            { page: 13, word: "durchfallen", base: "bei einer Prüfung durchfallen", sentence: "Geben Sie nicht auf, wenn Sie bei einer Prüfung durchfallen!" },
            { page: 13, word: "Allgemeinbildung", base: "die Allgemeinbildung", sentence: "Es gehört zur Allgemeinbildung, internationale Organisationen zu kennen." },
            
            // Sayfa 14
            { page: 14, word: "Bildungsniveau", base: "das Bildungsniveau", sentence: "Ein hohes Bildungsniveau verbessert die Berufsaussichten." },
            { page: 14, word: "Analphabeten", base: "der Analphabet", sentence: "Etwa 4% der Deutschen sind Analphabeten." },
            { page: 14, word: "fortbilden", base: "sich fortbilden / weiterbilden", sentence: "Man muss sich regelmäßig fortbilden, um auf dem neuesten Stand zu bleiben." },
            
            // Sayfa 20-21 (Studium)
            { page: 20, word: "Fachhochschule", base: "die Fachhochschule", sentence: "Das Studium an einer Fachhochschule gilt als besonders praxisorientiert." },
            { page: 21, word: "berufsbegleitend", base: "berufsbegleitend", sentence: "Ein berufsbegleitendes Studium bietet Berufstätigen die Möglichkeit, ein Studium zu absolvieren." },
            { page: 21, word: "Fernstudium", base: "das Fernstudium", sentence: "Man kann heute einen Hochschulabschluss auch per Fernstudium erwerben." },
            
            // Sayfa 22
            { page: 22, word: "Studienfach", base: "das Studienfach", sentence: "Wirtschaftswissenschaften sind beliebte Studienfächer." },
            { page: 22, word: "Zulassung", base: "die Zulassung", sentence: "Einige Zeit vor Beginn des Semesters erhalten die Bewerber ihre Zulassung." },
            { page: 22, word: "Numerus clausus", base: "der Numerus clausus", sentence: "Der Numerus clausus gibt eine Abiturnote vor, die man erreichen muss." },
            { page: 22, word: "immatrikulieren", base: "sich immatrikulieren / einschreiben", sentence: "Bevor man studieren kann, muss man sich an der Hochschule immatrikulieren." },
            { page: 22, word: "exmatrikulieren", base: "sich exmatrikulieren", sentence: "Es wird empfohlen, sich nach dem Studium exmatrikulieren zu lassen." },
            
            // Sayfa 23
            { page: 23, word: "Erstsemester", base: "die Erstsemester", sentence: "Orientierungsveranstaltungen sind eine gute Gelegenheit für Erstsemester." },
            { page: 23, word: "Regelstudienzeit", base: "die Regelstudienzeit", sentence: "Man sollte das Studium innerhalb der Regelstudienzeit abschließen können." },
            { page: 23, word: "Hochschulabsolventen", base: "der Hochschulabsolvent", sentence: "Untersuchungen belegen, dass Hochschulabsolventen seltener arbeitslos sind." },
            { page: 23, word: "promovieren", base: "promovieren / die Promotion", sentence: "Die meisten Mediziner promovieren, damit sie sich 'Dr.' nennen dürfen." },
            { page: 23, word: "Dissertation", base: "die Dissertation / Doktorarbeit", sentence: "Doktoranden sind verpflichtet, ihre Dissertationen zu veröffentlichen." },

            // Sayfa 34 (Wissenschaft)
            { page: 34, word: "Fachgebiet", base: "das Fachgebiet", sentence: "Wissenschaftler aus verschiedenen Fachgebieten arbeiten gemeinsam an einem Projekt." },
            { page: 34, word: "interdisziplinär", base: "interdisziplinär", sentence: "Interdisziplinäre Projekte beschäftigen sich mit Themen, die verschiedene Bereiche berühren." },
            
            // Sayfa 35
            { page: 35, word: "recherchiert", base: "recherchieren", sentence: "Von einem Wissenschaftler wird erwartet, dass er gründlich recherchiert." },
            { page: 35, word: "Erkenntnisse", base: "Erkenntnisse gewinnen", sentence: "Auch aus einem misslungenen Experiment lassen sich wichtige Erkenntnisse gewinnen." },
            
            // Sayfa 36
            { page: 36, word: "Hypothese", base: "eine Hypothese aufstellen", sentence: "Eine Hypothese ist eine Vermutung, auf der die Forschung basiert." },
            { page: 36, word: "Theorie", base: "eine Theorie widerlegen", sentence: "Die Evolutionstheorie von Lamarck wurde durch Forschungen widerlegt." },
            
            // Sayfa 37
            { page: 37, word: "Beweise", base: "Beweise vorlegen", sentence: "Die Wissenschaftlerin kann stichhaltige Beweise für ihre Theorie vorlegen." },

            // Sayfa 45 - Der Mensch bölümünün başı (genel limit)
        ];

        // State variables
        let workingDeck = []; // Kartların anlık kopyası
        let learnedCards = 0;
        let currentCard = null;
        let isFlipped = false;

        // Initialize App
        function initApp() {
            // Kopya oluştur
            workingDeck = [...allVocabData];
            learnedCards = 0;
            updateProgress();
            shuffleDeck();
        }

        // Shuffle
        function shuffleDeck() {
            for (let i = workingDeck.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [workingDeck[i], workingDeck[j]] = [workingDeck[j], workingDeck[i]];
            }
            if(workingDeck.length > 0) {
                loadCard(workingDeck[0]);
            }
        }

        // Load specific card
        function loadCard(cardData) {
            currentCard = cardData;
            isFlipped = false;
            
            const cardEl = document.getElementById('flashcard');
            const actionBtns = document.getElementById('action-buttons');
            
            // Reset styles
            cardEl.classList.remove('is-flipped');
            actionBtns.classList.add('opacity-0', 'pointer-events-none');
            
            // Prepare Front (Sentence with bold highlighted word)
            // Replace the target word with a bold highlighted span
            const regex = new RegExp(`\\b${cardData.word}\\b`, 'gi');
            let highlightedSentence = cardData.sentence.replace(regex, `<span class="highlight">$&</span>`);
            
            // If the exact word wasn't found due to conjugation or punctuation, fallback to simple replace
            if(highlightedSentence === cardData.sentence) {
                 highlightedSentence = cardData.sentence.replace(cardData.word, `<span class="highlight">${cardData.word}</span>`);
            }

            document.getElementById('page-number').innerText = cardData.page;
            document.getElementById('german-sentence').innerHTML = highlightedSentence;
            
            // Prepare Back (Base form)
            document.getElementById('base-form').innerText = cardData.base;
            document.getElementById('word-form').innerText = `Metin içinde: ${cardData.word}`;
        }

        // Flip Interaction
        function flipCard() {
            if(isFlipped) return; // Only flip once per card load to prevent closing before answering
            
            const cardEl = document.getElementById('flashcard');
            const actionBtns = document.getElementById('action-buttons');
            
            isFlipped = true;
            cardEl.classList.add('is-flipped');
            
            // Show buttons slightly after flip animation
            setTimeout(() => {
                actionBtns.classList.remove('opacity-0', 'pointer-events-none');
            }, 300);
        }

        // Handle Answer (Spaced Repetition Logic)
        function handleAnswer(knewIt) {
            // Prevent spam clicking
            if(!isFlipped) return;

            const currentIndex = workingDeck.indexOf(currentCard);
            
            if (knewIt) {
                // Remove from deck, increase learned count
                workingDeck.splice(currentIndex, 1);
                learnedCards++;
            } else {
                // Move card to the end of the deck (or randomly inside it) to see it again later
                const card = workingDeck.splice(currentIndex, 1)[0];
                const insertIndex = Math.min(workingDeck.length, 3 + Math.floor(Math.random() * 5)); // Put it a few cards back
                workingDeck.splice(insertIndex, 0, card);
            }
            
            updateProgress();

            // Next card or finish
            if (workingDeck.length > 0) {
                loadCard(workingDeck[0]);
            } else {
                showCompletion();
            }
        }

        function updateProgress() {
            document.getElementById('progress-text').innerText = `${allVocabData.length - workingDeck.length} / ${allVocabData.length}`;
            document.getElementById('learned-count').innerText = learnedCards;
        }

        function showCompletion() {
            document.querySelector('.scene').classList.add('hidden');
            document.getElementById('action-buttons').classList.add('hidden');
            document.getElementById('completion-screen').classList.remove('hidden');
            document.getElementById('completion-screen').classList.add('flex');
        }

        function resetApp() {
            document.querySelector('.scene').classList.remove('hidden');
            document.getElementById('action-buttons').classList.remove('hidden');
            document.getElementById('completion-screen').classList.add('hidden');
            document.getElementById('completion-screen').classList.remove('flex');
            initApp();
        }

        // Add keyboard support (Space to flip, Left/Right arrows for answers)
        document.addEventListener('keydown', function(event) {
            if (document.getElementById('completion-screen').classList.contains('hidden') === false) return;

            if (event.code === 'Space') {
                event.preventDefault(); // Prevent page scroll
                if(!isFlipped) flipCard();
            } else if (event.code === 'ArrowLeft' && isFlipped) {
                handleAnswer(false);
            } else if (event.code === 'ArrowRight' && isFlipped) {
                handleAnswer(true);
            }
        });

        // Start the application
        window.onload = initApp;
    </script>
</body>
</html>
