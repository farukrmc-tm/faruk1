/* ============================================================
   SRS (basit Leitner sistemi) — localStorage'da tutulur
   box: 0 (hiç bilinmiyor) -> 4 (iyi biliniyor)
   ============================================================ */
const SRS_KEY = "testdaf_srs_v1";
function loadSRS(){
  try{
    const raw = localStorage.getItem(SRS_KEY);
    return raw ? JSON.parse(raw) : {};
  }catch(e){ return {}; }
}
function saveSRS(state){
  try{ localStorage.setItem(SRS_KEY, JSON.stringify(state)); }catch(e){}
}
let srs = loadSRS();
DATA.forEach(w=>{ if(!srs[w.id]) srs[w.id] = {box:0, seen:0, correct:0}; });
saveSRS(srs);

function pickWordWeighted(){
  // box 0-1 kelimeler daha sık gelsin
  const pool = [];
  DATA.forEach(w=>{
    const box = srs[w.id].box;
    const weight = box===0?5 : box===1?3 : box===2?2 : 1;
    for(let i=0;i<weight;i++) pool.push(w);
  });
  return pool[Math.floor(Math.random()*pool.length)];
}

function updateStatsRow(){
  const boxes=[0,0,0,0,0];
  DATA.forEach(w=> boxes[srs[w.id].box]++ );
  const el = document.getElementById("statsRow");
  el.innerHTML = `
    <div class="stat-box"><b>${DATA.length}</b>Toplam kelime</div>
    <div class="stat-box"><b>${boxes[4]}</b>Ustalaşılan (Box 4)</div>
    <div class="stat-box"><b>${boxes[0]}</b>Zayıf (Box 0)</div>
  `;
}

/* ============================================================
   TAB YÖNETİMİ
   ============================================================ */
document.querySelectorAll("nav.tabs button").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    document.querySelectorAll("nav.tabs button").forEach(b=>b.classList.remove("active"));
    document.querySelectorAll(".panel").forEach(p=>p.classList.remove("active"));
    btn.classList.add("active");
    const tab = btn.dataset.tab;
    document.getElementById("panel-"+tab).classList.add("active");
    if(tab==="cloze") renderCloze();
    if(tab==="recall") renderRecall();
    if(tab==="grammar") renderGrammar();
    if(tab==="list") renderList();
  });
});

/* ============================================================
   MOD 1: LÜCKENTEXT (Cloze)
   ============================================================ */
let currentClozeWord = null;
let currentClozeSentence = null;

function renderCloze(){
  currentClozeWord = pickWordWeighted();
  const sList = currentClozeWord.sentences;
  currentClozeSentence = sList[Math.floor(Math.random()*sList.length)];
  const panel = document.getElementById("panel-cloze");
  const blankLen = currentClozeSentence.answer.length;
  const displaySentence = currentClozeSentence.de.replace("___", `<span class="blank">?</span>`);

  panel.innerHTML = `
    <div class="card-tag">Aktenzeichen ${DATA.indexOf(currentClozeWord)+1}/${DATA.length} · Box ${srs[currentClozeWord.id].box}</div>
    <div class="word-title">${currentClozeWord.word}</div>
    <div class="meta-line">${currentClozeWord.type} · ${currentClozeWord.register}${currentClozeWord.prep!=="—" ? " · "+currentClozeWord.prep : ""}</div>
    <div class="cloze-sentence">${displaySentence}</div>
    <div class="translation">${currentClozeSentence.tr}</div>
    <div class="row">
      <input type="text" id="clozeInput" placeholder="eksik kelimeyi yaz..." autocomplete="off">
      <button class="btn" id="clozeCheck">Kontrol et</button>
      <button class="btn secondary" id="clozeSkip">Geç</button>
    </div>
    <div class="feedback" id="clozeFeedback"></div>
  `;
  document.getElementById("clozeInput").focus();
  document.getElementById("clozeCheck").addEventListener("click", checkCloze);
  document.getElementById("clozeSkip").addEventListener("click", renderCloze);
  document.getElementById("clozeInput").addEventListener("keydown", e=>{
    if(e.key==="Enter") checkCloze();
  });
}

function normalize(s){
  return s.trim().toLowerCase()
    .replace(/ä/g,"a").replace(/ö/g,"o").replace(/ü/g,"u").replace(/ß/g,"ss");
}

function checkCloze(){
  const input = document.getElementById("clozeInput");
  const val = input.value;
  const correct = normalize(val) === normalize(currentClozeSentence.answer);
  const fb = document.getElementById("clozeFeedback");
  const wid = currentClozeWord.id;

  if(correct){
    srs[wid].box = Math.min(4, srs[wid].box+1);
    srs[wid].correct++;
  }else{
    srs[wid].box = 0;
  }
  srs[wid].seen++;
  saveSRS(srs);
  updateStatsRow();

  fb.className = "feedback show " + (correct ? "ok" : "bad");
  fb.innerHTML = `
    <span class="stamp ${correct?'ok':'bad'}">${correct ? 'BESTANDEN' : 'NICHT BESTANDEN'}</span><br>
    ${correct ? 'Doğru!' : `Doğrusu: <b>${currentClozeSentence.answer}</b>`}
    <div class="word-detail">
      <b>Eş anlamlı:</b> ${currentClozeWord.syn} &nbsp;·&nbsp; <b>Zıt anlamlı:</b> ${currentClozeWord.ant}<br>
      <b>TR:</b> ${currentClozeWord.tr}
    </div>
    <div class="row" style="margin-top:12px;">
      <button class="btn" id="nextCloze">Sıradaki →</button>
    </div>
  `;
  document.getElementById("nextCloze").addEventListener("click", renderCloze);
  input.disabled = true;
  document.getElementById("clozeCheck").disabled = true;
}

/* ============================================================
   MOD 2: TR -> DE HIZLI HATIRLAMA
   ============================================================ */
let currentRecallWord = null;

function renderRecall(){
  currentRecallWord = pickWordWeighted();
  const panel = document.getElementById("panel-recall");
  panel.innerHTML = `
    <div class="card-tag">Aktenzeichen ${DATA.indexOf(currentRecallWord)+1}/${DATA.length} · Box ${srs[currentRecallWord.id].box}</div>
    <div class="drill-q">Türkçesi: <b>${currentRecallWord.tr}</b></div>
    <div class="meta-line">${currentRecallWord.type}${currentRecallWord.prep!=="—" ? " · "+currentRecallWord.prep : ""}</div>
    <div class="row">
      <input type="text" id="recallInput" placeholder="Almancasını yaz..." autocomplete="off">
      <button class="btn" id="recallCheck">Kontrol et</button>
      <button class="btn secondary" id="recallSkip">Geç</button>
    </div>
    <div class="feedback" id="recallFeedback"></div>
  `;
  document.getElementById("recallInput").focus();
  document.getElementById("recallCheck").addEventListener("click", checkRecall);
  document.getElementById("recallSkip").addEventListener("click", renderRecall);
  document.getElementById("recallInput").addEventListener("keydown", e=>{
    if(e.key==="Enter") checkRecall();
  });
}

function checkRecall(){
  const input = document.getElementById("recallInput");
  const val = normalize(input.value);
  // temel kelimeyi (artikel/parantez olmadan) çıkar
  const baseWord = currentRecallWord.word.split(",")[0].split("/")[0].trim();
  const strippedBase = normalize(baseWord.replace(/^(die|der|das)\s+/i,""));
  const correct = normalize(input.value).includes(strippedBase) || strippedBase.includes(normalize(input.value)) && val.length>2;

  const wid = currentRecallWord.id;
  if(correct){
    srs[wid].box = Math.min(4, srs[wid].box+1);
    srs[wid].correct++;
  }else{
    srs[wid].box = 0;
  }
  srs[wid].seen++;
  saveSRS(srs);
  updateStatsRow();

  const fb = document.getElementById("recallFeedback");
  fb.className = "feedback show " + (correct ? "ok" : "bad");
  fb.innerHTML = `
    <span class="stamp ${correct?'ok':'bad'}">${correct ? 'BESTANDEN' : 'NICHT BESTANDEN'}</span><br>
    Doğrusu: <b>${currentRecallWord.word}</b>
    <div class="word-detail">
      <b>Register:</b> ${currentRecallWord.register}<br>
      <b>Eş/Zıt:</b> ${currentRecallWord.syn} / ${currentRecallWord.ant}
    </div>
    <div class="row" style="margin-top:12px;">
      <button class="btn" id="nextRecall">Sıradaki →</button>
    </div>
  `;
  document.getElementById("nextRecall").addEventListener("click", renderRecall);
  input.disabled = true;
  document.getElementById("recallCheck").disabled = true;
}

/* ============================================================
   MOD 3: POSSESSIVPRONOMEN DRILL
   ============================================================ */
let grammarIdx = 0;
let grammarOrder = [];

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function renderGrammar(){
  if(grammarOrder.length===0) grammarOrder = shuffle([...GRAMMAR_DRILL.keys()]);
  if(grammarIdx >= grammarOrder.length){
    document.getElementById("panel-grammar").innerHTML = `
      <div class="empty-state">Bu turu bitirdin! 🎉<br><br>
      <button class="btn" id="restartGrammar">Baştan başla</button></div>`;
    document.getElementById("restartGrammar").addEventListener("click", ()=>{
      grammarIdx=0; grammarOrder=shuffle([...GRAMMAR_DRILL.keys()]); renderGrammar();
    });
    return;
  }
  const q = GRAMMAR_DRILL[grammarOrder[grammarIdx]];
  const panel = document.getElementById("panel-grammar");
  const opts = shuffle(q.options);
  panel.innerHTML = `
    <div class="card-tag">Possessivpronomen · Soru ${grammarIdx+1}/${GRAMMAR_DRILL.length}</div>
    <div class="drill-q">${q.sentence.replace("___", '<span class="blank">___</span>')}</div>
    <div class="translation">${q.tr}</div>
    <div class="opt-grid" id="optGrid"></div>
    <div class="feedback" id="grammarFeedback"></div>
  `;
  const grid = document.getElementById("optGrid");
  opts.forEach(opt=>{
    const b = document.createElement("button");
    b.className = "opt-btn";
    b.textContent = opt;
    b.addEventListener("click", ()=> checkGrammar(opt, q, b, grid));
    grid.appendChild(b);
  });
}

function checkGrammar(chosen, q, btn, grid){
  const correct = chosen === q.correct;
  [...grid.children].forEach(b=>{
    b.disabled = true;
    if(b.textContent === q.correct) b.classList.add("correct");
    else if(b===btn && !correct) b.classList.add("wrong");
  });
  const fb = document.getElementById("grammarFeedback");
  fb.className = "feedback show " + (correct?"ok":"bad");
  fb.innerHTML = `
    <span class="stamp ${correct?'ok':'bad'}">${correct?'BESTANDEN':'NICHT BESTANDEN'}</span><br>
    Doğru cevap: <b>${q.correct}</b>
    <div class="row" style="margin-top:12px;">
      <button class="btn" id="nextGrammar">Sıradaki →</button>
    </div>
  `;
  document.getElementById("nextGrammar").addEventListener("click", ()=>{
    grammarIdx++; renderGrammar();
  });
}

/* ============================================================
   MOD 4: KARTEI (tüm liste + ilerleme durumu)
   ============================================================ */
function renderList(){
  const panel = document.getElementById("panel-list");
  const boxLabel = {0:"zayıf",1:"tekrar gerek",2:"orta",3:"iyi",4:"ustalaşıldı"};
  let html = `<div class="card-tag">Tüm kelimeler ve ilerleme durumu</div><div class="word-list">`;
  DATA.forEach(w=>{
    const box = srs[w.id].box;
    html += `
      <div class="word-list-item">
        <span>${w.word}</span>
        <span class="badge b${box}">Box ${box} · ${boxLabel[box]}</span>
      </div>`;
  });
  html += `</div>
    <div class="row" style="margin-top:18px;">
      <button class="btn secondary" id="resetProgress">Tüm ilerlemeyi sıfırla</button>
    </div>`;
  panel.innerHTML = html;
  document.getElementById("resetProgress").addEventListener("click", ()=>{
    if(confirm("Tüm ilerleme silinsin mi?")){
      DATA.forEach(w=> srs[w.id] = {box:0, seen:0, correct:0});
      saveSRS(srs);
      updateStatsRow();
      renderList();
    }
  });
}

updateStatsRow();
