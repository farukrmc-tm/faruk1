<!DOCTYPE html>
<html lang="tr">
<head>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        body { 
            font-family: 'Inter', sans-serif; 
            background: linear-gradient(135deg, #f0f4f8 0%, #e0e8f0 100%);
            color: #1a202c;
        }

        .scene {
            width: 100%;
            height: 300px;
            perspective: 1200px;
        }
        
        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-style: preserve-3d;
            cursor: pointer;
            border-radius: 1.5rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
        
        .card.is-flipped {
            transform: rotateY(180deg);
        }
        
        .card__face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            border-radius: 1.5rem;
            text-align: center;
            background: #ffffff;
            border: 1px solid #e2e8f0;
        }
        
        .card__face--front {
            /* Front face styling */
        }
        
        .card__face--back {
            transform: rotateY(180deg);
            background: #f8fafc;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        .modal-overlay {
            background-color: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(4px);
        }

        .category-card {
            transition: all 0.3s ease;
        }
        .category-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
    </style>
</head>

        let currentCategory = '';
        let currentDeck = [];
        let currentIndex = 0;
        let isFlipped = false;

        // Elements
        const menuScreen = document.getElementById('menu-screen');
        const studyScreen = document.getElementById('study-screen');
        const studyControls = document.getElementById('study-controls');
        
        const cardGerman = document.getElementById('card-german');
        const cardTurkish = document.getElementById('card-turkish');
        const progressText = document.getElementById('progress-text');
        const flashcard = document.getElementById('flashcard');
        
        const modal = document.getElementById('info-modal');
        const modalWrapper = document.getElementById('modal-content-wrapper');
        const examplesContainer = document.getElementById('examples-container');
        const modalWordTitle = document.getElementById('modal-word-title');

        // Logic
        function startStudy(category) {
            currentCategory = category;
            currentDeck = [...db[category]];
            currentIndex = 0;
            
            menuScreen.classList.add('hidden');
            studyScreen.classList.remove('hidden');
            studyScreen.classList.add('flex');
            studyControls.classList.remove('hidden');
            
            updateCard();
        }

        function showMenu() {
            studyScreen.classList.add('hidden');
            studyScreen.classList.remove('flex');
            studyControls.classList.add('hidden');
            menuScreen.classList.remove('hidden');
        }

        function updateCard() {
            if (currentDeck.length === 0) return;
            
            const wordObj = currentDeck[currentIndex];
            cardGerman.innerText = wordObj.german;
            cardTurkish.innerText = wordObj.turkish;
            
            progressText.innerText = `${currentIndex + 1} / ${currentDeck.length}`;
            
            // Ensure card is front-facing
            if (isFlipped) {
                flashcard.classList.remove('is-flipped');
                isFlipped = false;
            }
        }

        function flipCard() {
            isFlipped = !isFlipped;
            flashcard.classList.toggle('is-flipped');
        }

        function nextCard() {
            currentIndex = (currentIndex + 1) % currentDeck.length;
            updateCard();
        }

        function prevCard() {
            currentIndex = (currentIndex - 1 + currentDeck.length) % currentDeck.length;
            updateCard();
        }

        function openInfoModal() {
            const wordObj = currentDeck[currentIndex];
            modalWordTitle.innerText = `Kalıp: ${wordObj.german}`;
            
            // Generate HTML for the 5 examples
            let examplesHTML = '';
            wordObj.examples.forEach((ex, idx) => {
                examplesHTML += `
                    <div class="bg-slate-50 border border-slate-100 rounded-xl p-4 sm:p-5">
                        <div class="flex items-start gap-3">
                            <div class="bg-indigo-100 text-indigo-600 font-bold w-6 h-6 rounded-full flex items-center justify-center shrink-0 text-sm mt-0.5">
                                ${idx + 1}
                            </div>
                            <div>
                                <p class="text-slate-800 font-medium text-lg leading-snug mb-2">${ex.de}</p>
                                <p class="text-slate-500 text-base leading-snug"><i class="fas fa-arrow-turn-down fa-rotate-90 mr-1 text-slate-300"></i> ${ex.tr}</p>
                            </div>
                        </div>
                    </div>
                `;
            });
            
            examplesContainer.innerHTML = examplesHTML;
            
            // Show modal with animation
            modal.classList.remove('hidden');
            // Small delay to allow display block to register before animating opacity
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modalWrapper.classList.remove('scale-95');
                modalWrapper.classList.add('scale-100');
            }, 10);
        }

        function closeInfoModal() {
            modal.classList.add('opacity-0');
            modalWrapper.classList.remove('scale-100');
            modalWrapper.classList.add('scale-95');
            
            // Wait for animation to finish before hiding
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        }

        // Add keyboard support
        document.addEventListener('keydown', function(event) {
            // If modal is open, ESC closes it
            if (!modal.classList.contains('hidden')) {
                if (event.key === 'Escape') closeInfoModal();
                return;
            }

            // If study screen is active
            if (!studyScreen.classList.contains('hidden')) {
                if (event.code === 'Space') {
                    event.preventDefault(); // Prevent scrolling
                    flipCard();
                } else if (event.code === 'ArrowLeft') {
                    prevCard();
                } else if (event.code === 'ArrowRight') {
                    nextCard();
                } else if (event.code === 'Enter') {
                    openInfoModal();
                }
            }
        });

    </script>
