<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Almanca Kelime Ustası - Tam Sürüm</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        body { 
            font-family: 'Inter', sans-serif; 
            background: linear-gradient(135deg, #f0f4f8 0%, #e0e8f0 100%);
            color: #1a202c;
        }

        .scene {
            width: 100%;
            height: 300px;
            perspective: 1200px;
        }
        
        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-style: preserve-3d;
            cursor: pointer;
            border-radius: 1.5rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
        
        .card.is-flipped {
            transform: rotateY(180deg);
        }
        
        .card__face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            border-radius: 1.5rem;
            text-align: center;
            background: #ffffff;
            border: 1px solid #e2e8f0;
        }
        
        .card__face--back {
            transform: rotateY(180deg);
            background: #f8fafc;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        .modal-overlay {
            background-color: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(4px);
        }

        .category-card {
            transition: all 0.3s ease;
        }
        .category-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

    <header class="bg-slate-900 text-white shadow-lg p-4 shrink-0 z-10 relative">
        <div class="max-w-5xl mx-auto flex justify-between items-center">

                <p class="text-xs sm:text-sm text-slate-400 mt-1">Bildung und Forschung (Syf. 7-45) Tam Sürüm</p>
            </div>
            
            <div id="study-controls" class="hidden flex items-center gap-4">
                <div class="text-sm font-semibold bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-700">
                    <span id="progress-text" class="text-indigo-400">1 / 10</span>
                </div>
                <button onclick="showMenu()" class="text-slate-300 hover:text-white transition flex items-center gap-1 bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg border border-slate-700">
                    <i class="fas fa-times"></i> <span class="hidden sm:inline">Kapat</span>
                </button>
            </div>
        </div>
    </header>

    <main id="menu-screen" class="flex-1 overflow-auto p-6 flex flex-col items-center">
        <div class="w-full max-w-5xl mt-4 sm:mt-10">

            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <button onclick="startStudy('schule')" class="category-card bg-white rounded-2xl p-8 text-left border border-slate-200 shadow-sm relative overflow-hidden group">

                    <div class="w-14 h-14 bg-indigo-100 text-indigo-600 rounded-2xl flex items-center justify-center text-2xl mb-6 shadow-sm">
                        <i class="fas fa-school"></i>
                    </div>
                    <h3 class="text-xl font-bold text-slate-800 mb-2">1. Schule und Bildung</h3>
                    <p class="text-slate-500 text-sm mb-4">Okul, eğitim sistemi, notlar ve dersler. Tüm kalıplar eksiksiz eklendi.</p>
                    <div class="text-indigo-600 font-semibold text-sm flex items-center">
                        Çalışmaya Başla <i class="fas fa-arrow-right ml-2 text-xs"></i>
                    </div>
                </button>

                <button onclick="startStudy('studium')" class="category-card bg-white rounded-2xl p-8 text-left border border-slate-200 shadow-sm relative overflow-hidden group">

                    <div class="w-14 h-14 bg-emerald-100 text-emerald-600 rounded-2xl flex items-center justify-center text-2xl mb-6 shadow-sm">
                        <i class="fas fa-university"></i>
                    </div>
                    <h3 class="text-xl font-bold text-slate-800 mb-2">2. Studium</h3>
                    <p class="text-slate-500 text-sm mb-4">Üniversite, bölümler, akademisyenler ve kampüs hayatı. Hiçbir kelime atlanmadı.</p>
                    <div class="text-emerald-600 font-semibold text-sm flex items-center">
                        Çalışmaya Başla <i class="fas fa-arrow-right ml-2 text-xs"></i>
                    </div>
                </button>

                <button onclick="startStudy('wissenschaft')" class="category-card bg-white rounded-2xl p-8 text-left border border-slate-200 shadow-sm relative overflow-hidden group">
                    <div class="absolute top-0 right-0 w-32 h-32 bg-sky-50 rounded-bl-full -z-10 transition-transform group-hover:scale-110"></div>
                    <div class="w-14 h-14 bg-sky-100 text-sky-600 rounded-2xl flex items-center justify-center text-2xl mb-6 shadow-sm">
                        <i class="fas fa-microscope"></i>
                    </div>
                    <h3 class="text-xl font-bold text-slate-800 mb-2">3. Wissenschaft</h3>

                    <div class="text-sky-600 font-semibold text-sm flex items-center">
                        Çalışmaya Başla <i class="fas fa-arrow-right ml-2 text-xs"></i>
                    </div>
                </button>
            </div>
        </div>
    </main>

    <main id="study-screen" class="hidden flex-1 overflow-hidden p-4 sm:p-6 flex flex-col items-center justify-center w-full">

                    <button onclick="nextCard()" class="flex-1 bg-white border border-slate-200 text-slate-600 font-semibold py-3 px-4 rounded-xl hover:bg-slate-50 transition shadow-sm flex items-center justify-center gap-2">
                        Sonraki <i class="fas fa-arrow-right"></i>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <div id="info-modal" class="fixed inset-0 z-50 hidden modal-overlay flex items-center justify-center p-4 sm:p-6 opacity-0 transition-opacity duration-300">

                    "Das war ein wissenschaftlicher Durchbruch.|Bu bilimsel bir çığır açan başarıydı."]},

                    "Die Evolutionstheorie von Lamarck wurde durch weitere Forschungen widerlegt.|Lamarck'ın evrim teorisi sonraki araştırmalarla çürütüldü. (Orijinal)",

        };

        let currentCategory = '';
        let currentDeck = [];
        let currentIndex = 0;
        let isFlipped = false;

        const menuScreen = document.getElementById('menu-screen');
        const studyScreen = document.getElementById('study-screen');
        const studyControls = document.getElementById('study-controls');
        const cardGerman = document.getElementById('card-german');
        const cardTurkish = document.getElementById('card-turkish');
        const progressText = document.getElementById('progress-text');
        const flashcard = document.getElementById('flashcard');
        const modal = document.getElementById('info-modal');
        const modalWrapper = document.getElementById('modal-content-wrapper');
        const examplesContainer = document.getElementById('examples-container');
        const modalWordTitle = document.getElementById('modal-word-title');

        function startStudy(category) {
            currentCategory = category;
            currentDeck = [...db[category]];
            currentIndex = 0;
            
            menuScreen.classList.add('hidden');
            studyScreen.classList.remove('hidden');
            studyScreen.classList.add('flex');
            studyControls.classList.remove('hidden');
            
            updateCard();
        }

        function showMenu() {
            studyScreen.classList.add('hidden');
            studyScreen.classList.remove('flex');
            studyControls.classList.add('hidden');
            menuScreen.classList.remove('hidden');
        }

        function updateCard() {
            if (currentDeck.length === 0) return;
            
            const wordObj = currentDeck[currentIndex];
            cardGerman.innerText = wordObj.d;
            cardTurkish.innerText = wordObj.t;
            
            progressText.innerText = `${currentIndex + 1} / ${currentDeck.length}`;
            
            if (isFlipped) {
                flashcard.classList.remove('is-flipped');
                isFlipped = false;
            }
        }

        function flipCard() {
            isFlipped = !isFlipped;
            flashcard.classList.toggle('is-flipped');
        }

        function nextCard() {
            currentIndex = (currentIndex + 1) % currentDeck.length;
            updateCard();
        }

        function prevCard() {
            currentIndex = (currentIndex - 1 + currentDeck.length) % currentDeck.length;
            updateCard();
        }

        function openInfoModal() {
            const wordObj = currentDeck[currentIndex];
            modalWordTitle.innerText = `Kalıp: ${wordObj.d}`;
            
            let examplesHTML = '';
            wordObj.e.forEach((exStr, idx) => {
                const parts = exStr.split('|');
                // İlk cümle Orijinal kitap cümlesi olduğu için rengini hafif farklı yapıyoruz.
                const isOriginal = idx === 0;
                const badgeColor = isOriginal ? 'bg-amber-100 text-amber-700' : 'bg-indigo-100 text-indigo-600';
                
                examplesHTML += `
                    <div class="${isOriginal ? 'bg-amber-50 border-amber-200' : 'bg-slate-50 border-slate-100'} border rounded-xl p-4 sm:p-5 mb-4">
                        <div class="flex items-start gap-3">
                            <div class="${badgeColor} font-bold w-6 h-6 rounded-full flex items-center justify-center shrink-0 text-sm mt-0.5">
                                ${idx + 1}
                            </div>
                            <div>
                                <p class="text-slate-800 font-medium text-lg leading-snug mb-2">${parts[0]}</p>
                                <p class="text-slate-500 text-base leading-snug"><i class="fas fa-arrow-turn-down fa-rotate-90 mr-1 text-slate-300"></i> ${parts[1]}</p>
                            </div>
                        </div>
                    </div>
                `;
            });
            
            examplesContainer.innerHTML = examplesHTML;
            
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modalWrapper.classList.remove('scale-95');
                modalWrapper.classList.add('scale-100');
            }, 10);
        }

        function closeInfoModal() {
            modal.classList.add('opacity-0');
            modalWrapper.classList.remove('scale-100');
            modalWrapper.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        }

        document.addEventListener('keydown', function(event) {
            if (!modal.classList.contains('hidden')) {
                if (event.key === 'Escape') closeInfoModal();
                return;
            }

            if (!studyScreen.classList.contains('hidden')) {
                if (event.code === 'Space') {
                    event.preventDefault();
                    flipCard();
                } else if (event.code === 'ArrowLeft') {
                    prevCard();
                } else if (event.code === 'ArrowRight') {
                    nextCard();
                } else if (event.code === 'Enter') {
                    openInfoModal();
                }
            }
        });
    </script>
</body>
</html>
